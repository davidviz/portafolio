<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de Mando — CS Parachique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="envoltura" id="app"></div>
<script>/*__JS__*/</script>
<script>
/* Tablero compartido: sin información económica del suscrito. */
const D = /*__DATOS__*/ null;
const GALERIA = /*__RENDERS__*/ [];

const diasRestantes = diasEntre(D.meta.actualizado, D.meta.finServicio);
const transcurridos = diasEntre(D.meta.inicioServicio, D.meta.actualizado);
const pctPlazo = Math.min(100, Math.round((transcurridos / D.meta.plazoDias) * 100));
const criticas = D.alertas.filter((a) => a.nivel === 'CRITICA').length;
const pct = (e) => e.metrica.total ? (e.metrica.hecho / e.metrica.total) * 100 : 0;
const colorEtapa = (e) => e.estado === 'NO INICIADA' ? 'var(--borde-fuerte)'
  : pct(e) >= 100 ? 'var(--bien)' : pct(e) > 0 ? 'var(--serie-1)' : 'var(--serio)';

let h = `
<header class="cabecera">
  <div>
    <p class="kicker">Supervisión de equipamiento · Centro de mando</p>
    <h1>CS Parachique</h1>
    <p class="sub">${esc(D.meta.proyecto)}. Dónde está cada etapa de la especialidad, qué depende de quién y qué falta.</p>
  </div>
  ${sello(D)}
</header>`;

/* ---------- Expediente técnico: lo primero del tablero ----------
   La cuadrícula reproduce la carpeta «0.Expediente\\1.Ordenando Equip» tal
   como está en el Drive del supervisor: un módulo, un archivo. Cada tarjeta
   abre el PDF en la ventana del tablero, nunca en otra pestaña.           */
h += `<div class="seccion" style="margin-top:0">
  <h2>Expediente técnico</h2>
  <p class="nota">Los ${D.expediente.modulos.length} módulos del expediente firmado, en el mismo orden de la carpeta. <b>Toque un módulo para verlo aquí dentro</b>, en vista preliminar.</p>
  <div class="rejilla g4" style="gap:10px">
    ${D.expediente.modulos.map((m) => {
      const tono = m.obs === 0 ? 'bien' : m.prioridad === 'ALTA' ? 'critico'
        : m.prioridad === 'MEDIA' ? 'serio' : m.prioridad === 'BAJA' ? 'aviso' : 'neutro';
      return `<div class="tarjeta clic" data-modulo="${m.n}" style="padding:13px 14px">
        <div style="display:flex;gap:9px;align-items:baseline">
          <span style="font-family:var(--mono,monospace);font-size:.72rem;color:var(--tinta-tenue);flex:none">${String(m.n).padStart(2, '0')}</span>
          <b style="font-size:.88rem;line-height:1.35">${esc(m.nombre)}</b>
        </div>
        <div style="font-size:.71rem;color:var(--tinta-tenue);margin:6px 0 9px;word-break:break-word">${esc(m.archivo)}</div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${insignia(m.obs == null ? 'No revisado' : m.obs === 0 ? 'Conforme' : m.obs + ' obs.', tono, tono)}
          <span style="font-size:.71rem;color:var(--serie-1);margin-left:auto">Ver →</span>
        </div>
      </div>`;
    }).join('')}
  </div>

  <p class="nota" style="margin-top:22px">${esc(D.expediente.notaModulos)} La tabla filtra y exporta lo mismo que se ve arriba.</p>
  <div id="filtros-mod"></div>
  <div id="resumen-mod"></div>
  <div class="tabla-caja"><div class="tabla-scroll">
    <table class="datos" id="t-mod">
      <thead><tr><th>N°</th><th>Módulo del expediente</th><th>Archivo</th><th class="num">Obs.</th><th>Estado</th><th>Prioridad</th></tr></thead>
      <tbody>${D.expediente.modulos.map((m) => {
        const tono = m.prioridad === 'ALTA' ? 'critico' : m.prioridad === 'MEDIA' ? 'serio' : m.prioridad === 'BAJA' ? 'aviso' : 'bien';
        return `<tr class="clic" data-modulo="${m.n}"
          data-f-modulo="${m.n}. ${esc(m.nombre)}"
          data-f-obs="${m.obs === 0 ? 'Sin observaciones' : m.obs == null ? 'No revisado' : 'Con observaciones'}"
          data-f-prioridad="${esc(m.prioridad === '—' ? 'Sin prioridad' : m.prioridad)}"
          data-f-estado="${esc(m.estado)}">
          <td class="num">${m.n}</td>
          <td><b>${esc(m.nombre)}</b></td>
          <td style="font-size:.74rem;color:var(--tinta-suave)">${esc(m.archivo)}</td>
          <td class="num">${m.obs == null ? '—' : m.obs}</td>
          <td>${insignia(m.estado, m.obs === 0 ? 'bien' : tono, m.obs === 0 ? 'bien' : tono)}</td>
          <td>${esc(m.prioridad)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div></div>
</div>`;

/* ---------- Observaciones de compatibilidad al Proyectista ----------
   Viven aquí, junto al expediente que las origina. El tablero de fichas
   técnicas solo trata de los sustentos que presenta el Contratista.       */
const OBS_EXP = D.observaciones.lista || [];
const TONO_OBS = (n) => /CR[IÍ]TICA|ALTA/.test(n) ? 'critico' : /SUSTANCIAL|MEDIA/.test(n) ? 'serio' : 'aviso';

h += `<div class="seccion">
  <h2>Observaciones del expediente</h2>
  <p class="nota">${esc(D.observaciones.nota)} ${D.observaciones.total} en total: ${D.observaciones.criticas} críticas, ${D.observaciones.sustanciales} sustanciales y ${D.observaciones.leves} leves. Toque una fila para leerla completa.</p>
  <div id="filtros-obs"></div>
  <div id="resumen-obs"></div>
  <div class="tabla-caja"><div class="tabla-scroll">
    <table class="datos" id="t-obs">
      <thead><tr><th>N°</th><th>Componente</th><th>Equipo / sección</th><th>Tipo</th><th>Prioridad</th><th>Estado</th><th>Códigos</th></tr></thead>
      <tbody>${OBS_EXP.map((o) => `
        <tr class="clic" data-obs="${esc(o.n)}"
          data-f-componente="${esc(o.componente)}"
          data-f-prioridad="${esc(o.prioridad)}"
          data-f-estado="${esc(o.estado)}"
          data-f-codigo="${esc((o.codigos || [])[0] || 'Sin código asociado')}">
          <td class="cod">${esc(o.n)}</td>
          <td style="font-size:.78rem">${esc(o.componente)}</td>
          <td><b>${esc(o.equipo)}</b></td>
          <td style="font-size:.78rem;color:var(--tinta-suave)">${esc(o.tipo)}</td>
          <td>${insignia(o.prioridad, TONO_OBS(o.prioridad), TONO_OBS(o.prioridad))}</td>
          <td style="font-size:.78rem">${esc(o.estado)}</td>
          <td class="cod" style="font-size:.72rem">${(o.codigos || []).join(', ') || '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div></div>
</div>`;

/* ---------- Avance por etapa: el KPI principal ---------- */
h += `<div class="seccion">
  <h2>Avance por etapa</h2>
  <p class="nota">Cada etapa mide una sola cosa, la que de verdad la hace avanzar. Toque una para ver qué falta y de quién depende.</p>
  <div class="rejilla g3">
  ${D.etapas.map((e) => `
    <div class="tarjeta clic" data-etapa="${esc(e.id)}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div class="cifra-rotulo">Etapa ${e.orden}</div>
        ${insigniaEstado(e.estado)}
      </div>
      <h3 style="font-family:var(--cuerpo);font-size:.95rem;margin-top:8px">${esc(e.nombre)}</h3>
      <div class="cifra" style="font-size:1.6rem;color:${colorEtapa(e)}">${num(e.metrica.hecho)}<small>de ${num(e.metrica.total)} ${esc(e.metrica.unidad)}</small></div>
      <div class="barra" style="height:8px;margin-top:10px">
        ${pct(e) > 0 ? `<div style="width:${pct(e)}%;background:${colorEtapa(e)}"></div>` : ''}
        <div style="width:${100 - pct(e)}%;background:var(--superficie-2)"></div>
      </div>
      <div class="cifra-pie" style="margin-top:8px">${esc(e.metrica.etiqueta)}</div>
      <div style="margin-top:8px;font-size:.74rem;color:var(--tinta-tenue)">Depende de: <b style="color:var(--tinta-suave)">${esc(e.responsable)}</b></div>
    </div>`).join('')}
  </div>
</div>`;

/* ---------- Plazo ---------- */
h += `<div class="seccion">
  <h2>Consumo del plazo contractual</h2>
  <p class="nota">${esc(D.meta.notaPlazo)}</p>
  <div class="grafico">
    <div class="barra" data-tip="Plazo consumido|${transcurridos} de ${D.meta.plazoDias} días calendario">
      <div style="width:${pctPlazo}%;background:var(--serie-1)">${pctPlazo}% consumido</div>
      <div style="width:${100 - pctPlazo}%;background:var(--borde-fuerte);color:var(--tinta)">${diasRestantes} días</div>
    </div>
    <div class="leyenda">
      <span><i style="background:var(--serie-1)"></i>Transcurrido — ${transcurridos} días (${fechaCorta(D.meta.inicioServicio)} a ${fechaCorta(D.meta.actualizado)})</span>
      <span><i style="background:var(--borde-fuerte)"></i>Por transcurrir — ${diasRestantes} días · vence ${fechaCorta(D.meta.finServicio)}</span>
    </div>
  </div>
</div>`;

/* ---------- Alertas ---------- */
h += `<div class="seccion">
  <h2>Alertas de gestión</h2>
  <p class="nota">${criticas} crítica${criticas === 1 ? '' : 's'} · ${D.alertas.filter((a) => a.nivel === 'SUSTANCIAL').length} sustanciales · ${D.alertas.filter((a) => a.nivel === 'LEVE').length} leves.</p>
  <div id="alertas"></div>
</div>`;

/* ---------- Galería ---------- */
if (GALERIA.length) {
  h += `<div class="seccion">
    <h2>El proyecto terminado</h2>
    <p class="nota">${esc(D.renders.nota)} Toque una vista para ampliarla.</p>
    <div class="rejilla g3" style="gap:12px">
      ${GALERIA.map((v, i) => `
        <figure class="tarjeta clic" data-render="${i}" style="padding:0;overflow:hidden;margin:0">
          <img src="${v.uri}" alt="${esc(v.titulo)}" loading="lazy" style="display:block;width:100%;height:170px;object-fit:cover">
          <figcaption style="padding:12px 14px">
            <div style="font-weight:700;font-size:.86rem">${esc(v.titulo)}</div>
            <div style="font-size:.78rem;color:var(--tinta-suave);margin-top:3px">${esc(v.detalle)}</div>
          </figcaption>
        </figure>`).join('')}
    </div>
  </div>`;
}

/* ---------- Accesos ---------- */
const ACCESOS = [
  ['parachique-cartas', 'Cartas y Respuestas', 'Registro por etapa y área, cadena de trazabilidad y visor de cada documento.'],
  ['parachique-fichas', 'Fichas Técnicas', `Estado de los ${num(D.catalogo.length)} códigos de equipo y su incidencia en el presupuesto.`],
  ['parachique-valorizacion', 'Valorización', 'Hitos de pago por unidad y requisitos previos para habilitar la etapa.'],
  ['parachique-pagos', 'Honorarios y Pagos', 'Control económico del suscrito. Acceso reservado.'],
];
h += `<div class="seccion">
  <h2>Accesos del proyecto</h2>
  <div class="rejilla g2">
    ${ACCESOS.map(([slug, nombre, txt]) => `
      <a class="tarjeta clic" href="/proyectos/parachique/${slug}" target="_top" style="text-decoration:none;color:inherit">
        <div class="cifra-rotulo">${slug === 'parachique-pagos' ? 'Tablero reservado' : 'Tablero'}</div>
        <h3 style="margin-top:8px;font-size:1.1rem">${esc(nombre)}</h3>
        <p style="font-size:.82rem;color:var(--tinta-suave);margin:8px 0 0">${esc(txt)}</p>
        <p style="font-size:.8rem;font-weight:600;color:var(--primario);margin:12px 0 0">Abrir →</p>
      </a>`).join('')}
  </div>
  <div class="rejilla g2" style="margin-top:14px">
    <div class="tarjeta clic" id="k-protocolo">
      <div class="cifra-rotulo">Procedimiento</div>
      <h3 style="margin-top:8px;font-size:1.1rem">Protocolo de respuesta</h3>
      <p style="font-size:.82rem;color:var(--tinta-suave);margin:8px 0 0">Los ${D.protocoloRespuesta.length} pasos que sigue todo documento antes de salir, incluida la regla del membrete.</p>
      <p style="font-size:.8rem;font-weight:600;color:var(--primario);margin:12px 0 0">Ver protocolo →</p>
    </div>
    <div class="tarjeta clic" id="k-codigo">
      <div class="cifra-rotulo">Referencia</div>
      <h3 style="margin-top:8px;font-size:1.1rem">Codificación de entregables</h3>
      <p style="font-size:.82rem;color:var(--tinta-suave);margin:8px 0 0">Patrón <span class="cod">${esc(D.codificacion.patron)}</span> y los seis tipos de informe.</p>
      <p style="font-size:.8rem;font-weight:600;color:var(--primario);margin:12px 0 0">Ver referencia →</p>
    </div>
  </div>
</div>`;

h += pie(D);
document.getElementById('app').innerHTML = h;

/* ---------- Alertas ---------- */
document.getElementById('alertas').innerHTML = D.alertas.map((a, i) => {
  const [clase, icono] = MAPA_NIVEL[a.nivel] || ['neutro', 'neutro'];
  const tono = clase === 'critico' ? 'critico' : clase === 'serio' ? 'serio' : 'aviso';
  return `<div class="alerta n-${esc(a.nivel)} tarjeta clic" data-alerta="${i}" style="border-radius:10px">
    <div class="ico" style="color:var(--${tono})">${ICONOS[icono]}</div>
    <div><h4>${esc(a.titulo)}</h4><p>${esc(a.detalle)}</p>
    <div class="accion"><b>Acción:</b> ${esc(a.accion)}</div></div>
  </div>`;
}).join('');

document.querySelectorAll('[data-alerta]').forEach((el) => {
  el.addEventListener('click', () => {
    const a = D.alertas[+el.dataset.alerta];
    const [clase, icono] = MAPA_NIVEL[a.nivel];
    abrirVentana(a.titulo, insignia('Alerta ' + a.nivel.toLowerCase(), clase, icono),
      `<p style="font-size:.88rem;line-height:1.6">${esc(a.detalle)}</p>
       <div class="aviso-caja" style="margin-top:16px"><b>Acción recomendada</b><br>${esc(a.accion)}</div>`);
  });
});

/* ---------- Etapas ---------- */
document.querySelectorAll('[data-etapa]').forEach((el) => {
  el.addEventListener('click', () => {
    const e = D.etapas.find((x) => x.id === el.dataset.etapa);
    const docs = D.documentos.filter((d) => d.etapa === e.id);
    abrirVentana(`Etapa ${e.orden} — ${e.nombre}`, insigniaEstado(e.estado),
      `<p style="font-size:.88rem;line-height:1.6">${esc(e.descripcion)}</p>
       <dl class="dl" style="margin-top:14px">
         <dt>${esc(e.metrica.etiqueta)}</dt><dd><b>${num(e.metrica.hecho)}</b> de ${num(e.metrica.total)} ${esc(e.metrica.unidad)} · ${pct(e).toFixed(1)}%</dd>
         <dt>Depende de</dt><dd>${esc(e.responsable)}</dd>
         <dt>Estado</dt><dd>${insigniaEstado(e.estado)}</dd>
       </dl>
       <div class="aviso-caja" style="margin-top:16px">${esc(e.nota)}</div>
       ${docs.length ? `<div class="cifra-rotulo" style="margin:20px 0 8px">Documentos de esta etapa</div>
       <div class="tabla-caja"><div class="tabla-scroll"><table class="datos" style="min-width:460px">
         <thead><tr><th>Fecha</th><th>Código</th><th>Estado</th></tr></thead>
         <tbody>${docs.map((d) => `<tr><td style="white-space:nowrap">${fechaCorta(d.fecha)}</td>
           <td class="cod">${esc(d.codigo)}</td><td>${insigniaEstado(d.estado)}</td></tr>`).join('')}</tbody>
       </table></div></div>` : ''}`);
  });
});

/* ---------- Módulos del expediente ---------- */
document.querySelectorAll('[data-modulo]').forEach((el) => {
  el.addEventListener('click', () => {
    const m = D.expediente.modulos.find((x) => x.n === +el.dataset.modulo);
    abrirDocumentoDrive({
      titulo: `${m.n}. ${m.nombre}`,
      subtitulo: `Expediente técnico firmado${m.obs != null ? ' · ' + m.obs + ' observación(es)' : ''}`,
      driveId: m.drive, archivo: m.archivo,
      ruta: '0.Expediente\\1.Ordenando Equip\\' + m.archivo,
    });
  });
});

/* ---------- Galería ---------- */
document.querySelectorAll('[data-render]').forEach((el) => {
  el.addEventListener('click', () => {
    const v = GALERIA[+el.dataset.render];
    abrirVentana(v.titulo, `Vista de proyecto · ${esc(v.archivo)}`,
      `<img src="${v.uri}" alt="${esc(v.titulo)}" style="display:block;width:100%;border-radius:10px;border:1px solid var(--borde)">
       <p style="font-size:.86rem;margin:14px 0 0">${esc(v.detalle)}</p>`);
  });
});

document.getElementById('k-protocolo').addEventListener('click', () => {
  abrirVentana('Protocolo de respuesta', 'Se aplica a todo documento antes de su emisión',
    `<div class="aviso-caja" style="margin-bottom:16px;border-style:solid;border-color:var(--critico)">
      <b>Regla del membrete — no negociable.</b><br>${esc(D.membrete.regla)}
      <div class="ruta">${esc(D.membrete.ruta)}</div></div>
    <ol class="pasos">${D.protocoloRespuesta.map((p) => `<li>${esc(p)}</li>`).join('')}</ol>`);
});

document.getElementById('k-codigo').addEventListener('click', () => {
  abrirVentana('Codificación de entregables', esc(D.codificacion.patron),
    `<div class="tabla-caja"><div class="tabla-scroll"><table class="datos" style="min-width:420px">
      <thead><tr><th>Tipo</th><th>Descripción</th></tr></thead>
      <tbody>${D.codificacion.tipos.map((t) => `<tr><td class="cod">${esc(t.tipo)}</td><td>${esc(t.descripcion)}</td></tr>`).join('')}</tbody>
    </table></div></div>
    <p style="font-size:.82rem;color:var(--tinta-suave);margin-top:10px">${esc(D.codificacion.nota)}
    Ejemplo: <span class="cod">INF-SUP-MEN-EQ-DLVM-002-260831</span> es el segundo informe mensual, emitido el 31/08/2026.</p>`);
});

crearFiltros({
  contenedor: 'filtros-mod', tabla: 't-mod', resumen: 'resumen-mod',
  unidad: 'módulos', placeholder: 'Buscar módulo del expediente…',
  campos: [
    { clave: 'modulo', etiqueta: 'Módulo' },
    { clave: 'obs', etiqueta: 'Observaciones' },
    { clave: 'prioridad', etiqueta: 'Prioridad' },
    { clave: 'estado', etiqueta: 'Estado' },
  ],
  excel: {
    hoja: 'Expediente por módulos',
    archivo: 'CS-PARACHIQUE_expediente_modulos',
    proyecto: D.meta.proyecto,
    subtitulo: `CUI N° ${D.meta.cui} · Módulos del expediente técnico y resultado de la compatibilización`,
    supervisor: D.meta.supervisor, cip: D.meta.cip,
    supervision: D.meta.supervision, propietario: D.meta.supervisor,
  },
});

/* ---------- Observaciones del expediente ---------- */
document.querySelectorAll('[data-obs]').forEach((el) => {
  el.addEventListener('click', () => {
    const o = OBS_EXP.find((x) => x.n === el.dataset.obs);
    abrirVentana('Observación ' + o.n, esc(o.componente) + ' · ' + esc(o.prioridad),
      `<div class="lista-obs"><div class="obs-item p-${esc(o.prioridad)}">
        <div class="enc"><span class="n">${esc(o.n)}</span><h4>${esc(o.tipo)}</h4>
          ${insignia(o.prioridad, TONO_OBS(o.prioridad), TONO_OBS(o.prioridad))}
          ${insigniaEstado(/absuelt|conforme/i.test(o.estado) ? 'ATENDIDA' : 'PENDIENTE')}</div>
        <div class="cuerpo">${esc(o.descripcion)}</div>
        <dl>
          <dt>Componente</dt><dd>${esc(o.componente)}</dd>
          <dt>Equipo / sección</dt><dd>${esc(o.equipo)}</dd>
          <dt>Archivo</dt><dd>${esc(o.archivo)}</dd>
          <dt>Ubicación</dt><dd>${esc(o.ubicacion)}</dd>
          <dt>Folio escaneado</dt><dd>${esc(o.folio)}</dd>
          <dt>Sustento</dt><dd>${esc(o.sustento)}</dd>
          <dt>Se solicita</dt><dd>${esc(o.recomendacion)}</dd>
          <dt>Códigos</dt><dd class="cod">${(o.codigos || []).join(', ') || '—'}</dd>
          <dt>Estado</dt><dd>${esc(o.estado)}</dd>
        </dl>
      </div></div>`);
  });
});

crearFiltros({
  contenedor: 'filtros-obs', tabla: 't-obs', resumen: 'resumen-obs',
  unidad: 'observaciones', placeholder: 'Buscar observación, equipo o componente…',
  campos: [
    { clave: 'codigo', etiqueta: 'Código' },
    { clave: 'prioridad', etiqueta: 'Prioridad' },
    { clave: 'componente', etiqueta: 'Componente' },
    { clave: 'estado', etiqueta: 'Estado' },
  ],
  excel: {
    hoja: 'Observaciones del expediente',
    archivo: 'CS-PARACHIQUE_observaciones_expediente',
    proyecto: D.meta.proyecto,
    subtitulo: `CUI N° ${D.meta.cui} · Observaciones formuladas al Proyectista en la compatibilización`,
    supervisor: D.meta.supervisor, cip: D.meta.cip,
    supervision: D.meta.supervision, propietario: D.meta.supervisor,
  },
});

activarTips(document);
</script>
</body>
</html>
