<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fichas Técnicas — CS Parachique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="envoltura" id="app"></div>
<script>/*__JS__*/</script>
<script>
/* Tablero compartido. Los importes que aparecen aquí son del PRESUPUESTO DEL
   EXPEDIENTE (dato público del proyecto), no honorarios de la Supervisión. */
const D = /*__DATOS__*/ null;

const C = D.catalogo;
const TOTAL = D.presupuesto.total;

/* La escala con que la Supervisión califica un sustento. «Aprobada
   parcialmente» es el caso corriente: el equipo cumple la especificación pero
   queda un extremo por subsanar, así que la ficha no está cerrada y el
   Contratista debe presentar una versión corregida. */
const ESTADOS = [
  { id: 'APROBADA',              etiqueta: 'Aprobada',              clase: 'bien',    color: 'var(--bien)' },
  { id: 'APROBADA PARCIALMENTE', etiqueta: 'Aprobada parcialmente', clase: 'serio',   color: 'var(--serio)' },
  { id: 'OBSERVADA',             etiqueta: 'Observada',             clase: 'critico', color: 'var(--critico)' },
  { id: 'NO CUMPLE',             etiqueta: 'No cumple',             clase: 'critico', color: 'var(--critico)' },
  { id: 'PRESENTADA',            etiqueta: 'En revisión',           clase: 'aviso',   color: 'var(--aviso)' },
  { id: 'SIN PRESENTAR',         etiqueta: 'Sin presentar',         clase: 'neutro',  color: 'var(--borde-fuerte)' }
];
const SIN_ESTADO = { id: '?', etiqueta: 'Sin clasificar', clase: 'neutro', color: 'var(--borde-fuerte)' };
const estadoDe = (c) => ESTADOS.find((x) => x.id === c.ficha) || SIN_ESTADO;

/* Una ficha está en trámite mientras no esté aprobada del todo ni por
   presentar: ahí es donde el seguimiento tiene algo que vigilar. */
const EN_TRAMITE = ['PRESENTADA', 'OBSERVADA', 'APROBADA PARCIALMENTE', 'NO CUMPLE'];

const FAMILIAS = { D: 'D · Dispositivos y equipos', M: 'M · Mobiliario', E: 'E · Electromecánicos',
                   I: 'I · Instrumental', O: 'O · Otros', V: 'V · Vehículos' };
const familiaDe = (cod) => FAMILIAS[(cod.match(/^[A-Za-z]+/) || ['?'])[0].toUpperCase()] || 'Sin clasificar';
const rangoCant = (n) => n === 1 ? '1 unidad' : n <= 5 ? '2 a 5 unidades' : n <= 10 ? '6 a 10 unidades' : 'Más de 10 unidades';

/* Este tablero trata de FICHAS TÉCNICAS. Aquí solo entran las observaciones
   que la Supervisión formula al sustento que el Contratista presenta por cada
   código. Las observaciones de compatibilidad del expediente están dirigidas al
   Proyectista y viven en el Centro de Mando, junto al expediente. */
const DOC = D.documentos || [];
const docPorCodigo = (cod) => DOC.find((x) => x.codigo === cod);

function normalizarObs(o, p) {
  return {
    n: o.obs,
    titulo: o.materia || o.equipo || '',
    nivel: (o.nivel || '').toUpperCase() || 'LEVE',
    estado: o.estado || 'Por absolver',
    ubicacion: o.ubicacion || '',
    equipo: o.equipo || '',
    origen: o.origen || (p && p.informe) || '',
    fuente: o.fuente || 'Pronunciamiento sobre el sustento del Contratista',
    extremos: o.extremos || null,
    codigos: o.codigos || [],
    informe: (p && p.informe) || '',
  };
}

const TONO = (nivel) =>
  (nivel === 'CRITICA' || nivel === 'CRÍTICA' || nivel === 'ALTA') ? 'critico'
  : (nivel === 'SUSTANCIAL' || nivel === 'MEDIA') ? 'serio' : 'aviso';

const OBS_FICHA = D.pronunciamientos.flatMap((p) => (p.detalle || []).map((o) => normalizarObs(o, p)));

const obsDe = (cod) => OBS_FICHA.filter((o) => o.codigos.includes(cod));

const tarjetaObs = (o) => `
  <div class="obs-item p-${esc(o.nivel)}">
    <div class="enc">
      <span class="n">${esc(o.n)}</span>
      <h4>${esc(o.titulo)}</h4>
      ${insignia(o.nivel, TONO(o.nivel), TONO(o.nivel))}
      ${insigniaEstado(/conforme|absuelt|subsanad/i.test(o.estado) ? 'ATENDIDA' : 'PENDIENTE')}
    </div>
    <dl>
      ${o.equipo ? `<dt>Equipo</dt><dd>${esc(o.equipo)}</dd>` : ''}
      ${o.ubicacion ? `<dt>Ubicación en el sustento</dt><dd>${esc(o.ubicacion)}</dd>` : ''}
      ${o.extremos ? `<dt>Extremos</dt><dd>${o.extremos}</dd>` : ''}
      <dt>Absuelta en</dt><dd class="cod">${esc(o.informe)}</dd>
      <dt>Estado</dt><dd>${esc(o.estado)}</dd>
    </dl>
  </div>`;

/* ---------- Trazabilidad documental de un código ----------
   Qué carta trajo el sustento de este equipo y con qué informe se contestó.
   Ambos abren en el visor interno; no se sale del tablero.               */
function trazaDe(cod) {
  return D.pronunciamientos
    .filter((p) => (p.detalle || []).some((o) => (o.codigos || []).includes(cod)))
    .map((p) => {
      const emitido = docPorCodigo(p.informe) || null;
      const recibido = emitido && emitido.responde ? docPorCodigo(emitido.responde) : null;
      return { p, emitido, recibido };
    });
}

function tarjetaDoc(d, rotulo, cod) {
  if (!d) return '';
  const tieneVisor = Object.keys(d.drive || {}).length > 0;
  return `<div class="tarjeta ${tieneVisor ? 'clic' : ''}" ${tieneVisor ? `data-doc-ficha="${esc(d.id)}" data-doc-cod="${esc(cod)}"` : ''}>
    <div class="cifra-rotulo">${esc(rotulo)}</div>
    <div style="font-weight:600;font-size:.9rem;margin:4px 0 6px" class="cod">${esc(d.codigo)}</div>
    <div style="font-size:.8rem;color:var(--tinta-suave);line-height:1.5">${esc(d.asunto || '')}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
      <span style="font-size:.74rem;color:var(--tinta-tenue)">${fechaCorta(d.fecha)}</span>
      ${insigniaEstado(d.estado)}
      ${tieneVisor ? '<span style="font-size:.74rem;color:var(--serie-1);margin-left:auto">Ver documento →</span>'
                   : '<span style="font-size:.74rem;color:var(--tinta-tenue);margin-left:auto">Sin enlace en Drive</span>'}
    </div>
  </div>`;
}

function bloqueTraza(cod) {
  const t = trazaDe(cod);
  if (!t.length) {
    return `<div class="aviso-caja" style="margin-top:16px">Este código todavía no ha sido materia de una carta del Contratista ni de un pronunciamiento de la Supervisión.</div>`;
  }
  return t.map(({ p, emitido, recibido }) => `
    <div class="cifra-rotulo" style="margin:20px 0 10px">Trazabilidad documental</div>
    <div class="rejilla g2" style="gap:12px">
      ${tarjetaDoc(recibido, 'Se presentó con', cod)}
      ${tarjetaDoc(emitido, 'Se contestó con', cod)}
    </div>
    ${p.resultado ? `<div class="aviso-caja" style="margin-top:12px"><b>Resultado del pronunciamiento.</b> ${esc(p.resultado)}</div>` : ''}`).join('');
}

/* ---------- Seguimiento por código ----------
   Lo que el Contratista presentó, lo que la Supervisión le respondió y lo que
   le queda por levantar. Es lo que convierte el catálogo en un cuadro que el
   Contratista puede leer de corrido y saber qué le toca. */
function seguimientoDe(cod) {
  const t = trazaDe(cod);
  const ultimo = (lista) => lista.filter(Boolean).slice(-1)[0] || null;
  return {
    recibido: ultimo(t.map((x) => x.recibido)),
    emitido: ultimo(t.map((x) => x.emitido)),
    abiertas: obsDe(cod).filter((o) => !/subsanad|absuelt|conforme/i.test(o.estado)),
  };
}

/* Celda de documento: abre la vista preliminar sin disparar la ficha del ítem. */
const celdaDoc = (d, cod) => d
  ? `<span class="cod" data-doc-tabla="${esc(d.id)}" data-doc-desde="${esc(cod)}"
      style="cursor:pointer;color:var(--serie-1);text-decoration:underline;
             text-decoration-style:dotted;text-underline-offset:3px;font-size:.72rem"
      title="Ver ${esc(d.codigo)} en vista preliminar">${esc(d.codigo)}</span>`
  : '<span style="color:var(--tinta-tenue)">—</span>';

/* El texto completo viaja al Excel aunque en pantalla se recorte a dos líneas. */
const celdaObs = (lista) => lista.length
  ? `<div style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
                 overflow:hidden;font-size:.74rem;line-height:1.45;max-width:330px"
      >${lista.map((o) => `${esc(o.n)} — ${esc(o.titulo)}`).join(' · ')}</div>`
  : '<span style="color:var(--bien);font-size:.74rem">Sin observaciones</span>';

const por = (id) => C.filter((c) => c.ficha === id);
const monto = (l) => l.reduce((s, c) => s + (c.parcial || 0), 0);
const unid = (l) => l.reduce((s, c) => s + c.cant, 0);

const aprobadas = por('APROBADA');
const observadas = por('OBSERVADA');
const enRevision = por('PRESENTADA');
const enTramite = C.filter((c) => EN_TRAMITE.includes(c.ficha));
const sinPresentar = por('SIN PRESENTAR');
const faltanAprobar = C.filter((c) => c.ficha !== 'APROBADA');
const pctAprobado = (monto(aprobadas) / TOTAL) * 100;

let h = `
<header class="cabecera">
  <div>
    <p class="kicker">Supervisión de equipamiento · Etapa 3 — Especificaciones técnicas</p>
    <h1>Fichas Técnicas</h1>
    <p class="sub">Estado de aprobación de las fichas técnicas de los ${num(C.length)} códigos de equipo del expediente, con su incidencia en el presupuesto de equipamiento. Aprobar una ficha acredita que el bien ofertado cumple la especificación; <b>no habilita valorización ni pago</b>.</p>
  </div>
  ${sello(D)}
</header>`;

/* ---------- Cifras ---------- */
/* Los cuatro peldaños de la escala, en el orden del trámite. La tarjeta
   grande es la que manda hoy: 179 sin presentar. */
h += `<div class="rejilla g4">
  ${[
    { id: 'APROBADA',              rotulo: 'Aprobadas',              tono: 'var(--bien)',    kpi: 'k-aprobadas' },
    { id: 'APROBADA PARCIALMENTE', rotulo: 'Aprobadas parcialmente', tono: 'var(--serio)',   kpi: 'k-parciales' },
    { id: 'OBSERVADA',             rotulo: 'Observadas',             tono: 'var(--critico)', kpi: 'k-observadas' },
    { id: 'SIN PRESENTAR',         rotulo: 'Sin presentar',          tono: 'var(--tinta-tenue)', kpi: 'k-sinpresentar' },
  ].map((e) => {
    const l = por(e.id);
    const pct = (monto(l) / TOTAL) * 100;
    return `<div class="tarjeta clic" id="${e.kpi}">
      <div class="cifra-rotulo">${e.rotulo}</div>
      <div class="cifra" style="color:${l.length ? e.tono : 'var(--tinta-tenue)'}">${l.length}<small>de ${C.length}</small></div>
      <div class="cifra-pie">${num(unid(l))} unidades · ${soles(monto(l))} · ${pct.toFixed(1)}% del presupuesto</div>
    </div>`;
  }).join('')}
</div>`;

/* ---------- Avance y composición, uno al lado del otro ---------- */
const GRUPOS = [...new Set(C.map((c) => c.grupo))];
const resumenGrupo = GRUPOS.map((g) => {
  const l = C.filter((c) => c.grupo === g);
  const ap = l.filter((c) => c.ficha === 'APROBADA');
  return { grupo: g, cod: l.length, und: unid(l), monto: monto(l), aprob: ap.length, montoAprob: monto(ap) };
}).sort((a, b) => b.monto - a.monto);

h += `<div class="rejilla g2" style="align-items:stretch">
  <div class="grafico">
    <h3>Avance de aprobación</h3>
    <p class="sub">Medido sobre el valor de expediente de cada código, que es la unidad que interesa a la Entidad.</p>
    <div id="graf-anillo"></div>
    <div class="leyenda" style="justify-content:center">
      ${ESTADOS.filter((e) => por(e.id).length).map((e) => {
        const l = por(e.id);
        return `<span><i style="background:${e.color}"></i>${e.etiqueta} — ${l.length} cód.</span>`;
      }).join('')}
    </div>
  </div>
  <div class="grafico">
    <h3>Composición del presupuesto por grupo</h3>
    <p class="sub">Dónde está concentrado el valor. Determina qué grupos conviene exigir primero al Contratista.</p>
    <div id="graf-grupo"></div>
    <div class="leyenda"><span><i style="background:var(--serie-1)"></i>Valor de expediente por grupo (con IGV)</span></div>
  </div>
</div>`;

/* ---------- Catalogo completo ---------- */
h += `<div class="seccion">
  <h2>Catálogo de equipamiento</h2>
  <p class="nota">Cuadro de seguimiento al Contratista: los ${C.length} códigos del expediente con el informe que los presentó, la respuesta de esta Supervisión y lo que queda por levantar. <b>Toque una fila</b> para el detalle del ítem; <b>toque un código de informe</b> para verlo en vista preliminar.</p>
  <div id="filtros"></div>
  <div id="resumen"></div>
  <div class="tabla-caja"><div class="tabla-scroll" style="max-height:620px;overflow-y:auto">
    <table class="datos" id="t-cat">
      <thead><tr><th>Código</th><th>Denominación</th><th>Grupo</th><th class="num">Cant.</th><th class="num">P. unitario</th><th class="num">Parcial</th><th class="num">Incid.</th><th>Ficha técnica</th><th>Ver.</th><th>Informe del Contratista</th><th>Respuesta de la Supervisión</th><th>Observaciones por levantar</th></tr></thead>
      <tbody>${C.map((c) => {
        const e = estadoDe(c);
        const g = seguimientoDe(c.cod);
        return `<tr class="clic" data-cod="${esc(c.cod)}"
          data-f-codigo="${esc(c.cod)}"
          data-f-version="${c.version ? 'v' + c.version : 'Sin presentar'}"
          data-f-grupo="${esc(c.grupo)}"
          data-f-familia="${esc(familiaDe(c.cod))}"
          data-f-ficha="${esc(e.etiqueta)}"
          data-f-pendientes="${g.abiertas.length ? 'Con observaciones por levantar' : 'Sin observaciones pendientes'}"
          data-f-cantidad="${esc(rangoCant(c.cant))}">
          <td class="cod">${esc(c.cod)}</td>
          <td>${esc(c.den)}</td>
          <td style="font-size:.74rem;color:var(--tinta-suave)">${esc(c.grupo)}</td>
          <td class="num">${c.cant}</td>
          <td class="num">${soles(c.pu)}</td>
          <td class="num">${soles(c.parcial)}</td>
          <td class="num">${(c.parcial / TOTAL * 100).toFixed(2)}%</td>
          <td>${insignia(e.etiqueta, e.clase, e.clase === 'neutro' ? 'neutro' : e.clase)}</td>
          <td class="cod" style="font-size:.74rem">${c.version ? 'v' + c.version : '—'}</td>
          <td>${celdaDoc(g.recibido, c.cod)}</td>
          <td>${celdaDoc(g.emitido, c.cod)}</td>
          <td>${celdaObs(g.abiertas)}</td>
        </tr>`;
      }).join('')}
      </tbody>
      <tfoot><tr><td colspan="3">${C.length} códigos</td><td class="num">${num(unid(C))}</td><td></td><td class="num">${soles(TOTAL)}</td><td class="num">100%</td><td></td><td></td><td></td><td></td><td style="font-size:.74rem">${OBS_FICHA.filter((o) => !/subsanad|absuelt|conforme/i.test(o.estado)).length} observaciones por levantar</td></tr></tfoot>
    </table>
  </div></div>
</div>`;

/* ---------- Resumen por grupo ---------- */
h += `<div class="seccion">
  <h2>Resumen por grupo genérico</h2>
  <p class="nota">Dónde está concentrado el valor del equipamiento. Determina qué grupos conviene exigir primero al Contratista.</p>
  <div class="tabla-caja" style="margin-top:14px"><div class="tabla-scroll">
    <table class="datos">
      <thead><tr><th>Grupo</th><th class="num">Códigos</th><th class="num">Unidades</th><th class="num">Valor de expediente</th><th class="num">% del total</th><th class="num">Fichas aprobadas</th></tr></thead>
      <tbody>${resumenGrupo.map((g) => `
        <tr>
          <td><b>${esc(g.grupo)}</b></td>
          <td class="num">${g.cod}</td>
          <td class="num">${num(g.und)}</td>
          <td class="num">${soles(g.monto)}</td>
          <td class="num">${(g.monto / TOTAL * 100).toFixed(1)}%</td>
          <td class="num">${g.aprob} / ${g.cod}</td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr><td>Total</td><td class="num">${C.length}</td><td class="num">${num(unid(C))}</td><td class="num">${soles(TOTAL)}</td><td class="num">100.0%</td><td class="num">${aprobadas.length} / ${C.length}</td></tr></tfoot>
    </table>
  </div></div>
</div>`;

/* ---------- Aviso de alcance ---------- */
h += `<div class="seccion">
  <div class="alerta" style="border-left-color:var(--serie-1)">
    <div class="ico" style="color:var(--serie-1)">${ICONOS.info}</div>
    <div>
      <h4>Qué significa y qué no significa una ficha aprobada</h4>
      <p>La aprobación de una ficha técnica acredita que el bien ofertado por el Contratista cumple los requisitos técnicos mínimos del expediente. <b>No acredita entrega, no acredita instalación y no habilita pago.</b> El importe asociado a las fichas aprobadas es el valor de expediente de esos ítems y sirve para dimensionar el avance de la revisión, no para valorizar.</p>
      <div class="accion"><b>Monto valorizable a la fecha:</b> ${soles(0)} — no se ha efectuado entrega de bienes en obra. La valorización se rige por los hitos del tablero de <b>Valorización</b>.</div>
    </div>
  </div>
</div>`;

/* ---------- Condiciones del precio ---------- */
h += `<div class="seccion">
  <h2>Condiciones del precio del expediente</h2>
  <p class="nota">${esc(D.presupuesto.notaCondiciones)} Son exigibles a cada ficha técnica y a cada entrega.</p>
  <div class="rejilla g2">
    ${D.presupuesto.condiciones.map((c) => `
      <div class="tarjeta" style="display:flex;gap:12px;align-items:flex-start">
        <span style="color:var(--serie-1);flex:none;margin-top:2px">${ICONOS.info}</span>
        <div style="font-size:.86rem">${esc(c)}</div>
      </div>`).join('')}
  </div>
  <div class="aviso-caja" style="margin-top:12px">
    <b>Fuente:</b> ${esc(D.presupuesto.fuente)}, filas 201 a 204.
    Estas condiciones son el fundamento contractual de los hitos de valorización posteriores a la entrega:
    instalación, protocolo de prueba, capacitación y dossier.
  </div>
</div>`;

h += pie(D);
document.getElementById('app').innerHTML = h;

/* ---------- Los dos gráficos ---------- */
anillo(document.getElementById('graf-anillo'),
  ESTADOS.slice().reverse().map((e) => {
    const l = por(e.id);
    return {
      etiqueta: e.etiqueta, color: e.color, valor: monto(l),
      nota: `${l.length} códigos · ${num(unid(l))} unidades · ${soles(monto(l))} (${((monto(l) / TOTAL) * 100).toFixed(1)}%)`,
    };
  }),
  {
    cifra: `${((monto(aprobadas) / TOTAL) * 100).toFixed(1)}%`,
    rotulo: 'del presupuesto aprobado',
    pie: `${aprobadas.length} de ${C.length} códigos · ${soles(monto(aprobadas))} de ${soles(TOTAL)}`,
  });

barrasH(document.getElementById('graf-grupo'),
  resumenGrupo.map((g) => ({
    etiqueta: g.grupo.replace('EQUIPOS ', '').replace('MOBILIARIO ', 'MOB. '),
    valor: g.monto,
    nota: `${g.cod} códigos · ${g.und} unidades`
  })), { formato: soles });

/* ---------- Ventanas ---------- */
function fichaItem(cod) {
  const c = C.find((x) => x.cod === cod);
  const e = estadoDe(c);
  abrirVentana(`${c.cod} — ${c.den}`, `${esc(c.grupo)} · ${insignia(e.etiqueta, e.clase, e.clase === 'neutro' ? 'neutro' : e.clase)}`,
    `<dl class="dl">
      <dt>Código</dt><dd class="cod">${esc(c.cod)}</dd>
      <dt>Denominación</dt><dd>${esc(c.den)}</dd>
      <dt>Grupo</dt><dd>${esc(c.grupo)}</dd>
      <dt>Cantidad según expediente</dt><dd><b>${c.cant}</b> unidad${c.cant === 1 ? '' : 'es'}</dd>
      <dt>Precio unitario promedio</dt><dd>${soles(c.pu)}</dd>
      <dt>Parcial del ítem</dt><dd><b>${soles(c.parcial)}</b></dd>
      <dt>Incidencia en el presupuesto</dt><dd>${(c.parcial / TOTAL * 100).toFixed(2)}%</dd>
      <dt>Estado de la ficha técnica</dt><dd>${insignia(e.etiqueta, e.clase, e.clase === 'neutro' ? 'neutro' : e.clase)}</dd>
      ${c.version ? `<dt>Versión del sustento</dt><dd>v${c.version}${c.versiones > 1 ? ` — de ${c.versiones} presentadas` : ' — primera presentación'}</dd>` : ''}
      ${c.marca ? `<dt>Marca y fabricante</dt><dd>${esc(c.marca)}${c.modelo ? ' · ' + esc(c.modelo) : ''}${c.fabricante ? '<br><span style="font-size:.8rem;color:var(--tinta-suave)">' + esc(c.fabricante) + '</span>' : ''}</dd>` : ''}
      ${c.verificacionWeb ? `<dt>Verificación del fabricante</dt><dd>${insigniaEstado(c.verificacionWeb === 'AUTENTICO' ? 'AUTÉNTICO' : c.verificacionWeb)}</dd>` : ''}
      <dt>Unidades entregadas en obra</dt><dd>0</dd>
      <dt>Monto valorizable</dt><dd>${soles(0)}</dd>
    </dl>
    ${c.queFalta ? `<div class="aviso-caja" style="margin-top:16px;border-style:solid;border-color:var(--serio)"><b>Qué falta para aprobar la ficha.</b> ${esc(c.queFalta)}</div>` : ''}
    ${(c.historial || []).length > 1 ? `
      <div class="cifra-rotulo" style="margin:20px 0 10px">Versiones presentadas (${c.historial.length})</div>
      <div class="tabla-caja"><table class="datos">
        <thead><tr><th>Versión</th><th>Fecha</th><th>Carta del Contratista</th><th>Informe que la califica</th><th>Resultado</th></tr></thead>
        <tbody>${c.historial.map((v) => `<tr>
          <td class="cod">v${v.version}</td>
          <td style="white-space:nowrap">${v.fecha ? fechaCorta(v.fecha) : '—'}</td>
          <td style="font-size:.76rem">${esc(v.carta || '—')}</td>
          <td class="cod" style="font-size:.72rem">${esc(v.informe || '—')}</td>
          <td>${insignia((ESTADOS.find((x) => x.id === v.resultado) || SIN_ESTADO).etiqueta,
                         (ESTADOS.find((x) => x.id === v.resultado) || SIN_ESTADO).clase,
                         (ESTADOS.find((x) => x.id === v.resultado) || SIN_ESTADO).clase)}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : ''}
    ${(() => {
      const lista = obsDe(c.cod);
      if (!lista.length) {
        return '<div class="aviso-caja" style="margin-top:16px">Sin observaciones a la ficha técnica de este código.</div>';
      }
      return `<div class="cifra-rotulo" style="margin:20px 0 10px">Observaciones a la ficha técnica (${lista.length})</div>
        <div class="lista-obs">${lista.map(tarjetaObs).join('')}</div>`;
    })()}
    ${bloqueTraza(c.cod)}
    <div class="aviso-caja" style="margin-top:14px">
      <b>Fuente del precio:</b> ${esc(D.presupuesto.fuente)}, fila ${c.fila}.
      Precio promedio de tres cotizaciones, con IGV incluido y bajo las condiciones de garantía de 2 años,
      instalación, capacitación, manuales y mantenimiento en garantía.
    </div>`);
  enlazarDocsFicha();
}
document.querySelectorAll('[data-cod]').forEach((el) => el.addEventListener('click', () => fichaItem(el.dataset.cod)));

/* Los códigos de informe de la tabla abren su vista preliminar. Se detiene la
   propagación para que el clic no abra además la ficha del ítem. */
document.querySelectorAll('[data-doc-tabla]').forEach((el) => {
  el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const d = DOC.find((x) => x.id === el.dataset.docTabla);
    if (!d) return;
    abrirFichaDocumento(d, D.etapas);
    const meta = document.getElementById('vmeta');
    const cod = el.dataset.docDesde;
    if (meta && cod) {
      meta.insertAdjacentHTML('afterbegin',
        `<button type="button" class="btn" style="padding:3px 9px;font-size:.72rem;margin-right:8px" data-volver="${esc(cod)}">← Ver ficha de ${esc(cod)}</button>`);
      meta.querySelector('[data-volver]').addEventListener('click', () => fichaItem(cod));
    }
  });
});

function listado(titulo, meta, lista) {
  abrirVentana(titulo, meta, lista.length
    ? `<div class="tabla-caja"><div class="tabla-scroll" style="max-height:60vh;overflow-y:auto"><table class="datos">
        <thead><tr><th>Código</th><th>Denominación</th><th class="num">Cant.</th><th class="num">Parcial</th></tr></thead>
        <tbody>${lista.map((c) => `<tr><td class="cod">${esc(c.cod)}</td><td>${esc(c.den)}</td><td class="num">${c.cant}</td><td class="num">${soles(c.parcial)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="2">${lista.length} códigos</td><td class="num">${num(unid(lista))}</td><td class="num">${soles(monto(lista))}</td></tr></tfoot>
      </table></div></div>`
    : `<div class="aviso-caja">No hay códigos en esta condición.</div>`);
}

[
  { kpi: 'k-aprobadas',     id: 'APROBADA',              titulo: 'Fichas técnicas aprobadas' },
  { kpi: 'k-parciales',     id: 'APROBADA PARCIALMENTE', titulo: 'Fichas aprobadas parcialmente' },
  { kpi: 'k-observadas',    id: 'OBSERVADA',             titulo: 'Fichas observadas' },
  { kpi: 'k-sinpresentar',  id: 'SIN PRESENTAR',         titulo: 'Fichas sin presentar' },
].forEach((e) => {
  const el = document.getElementById(e.kpi);
  if (!el) return;
  el.addEventListener('click', () => {
    const l = por(e.id);
    listado(e.titulo, `${l.length} de ${C.length} códigos · ${soles(monto(l))} de valor de expediente`, l);
  });
});

crearFiltros({
  contenedor: 'filtros',
  tabla: 't-cat',
  resumen: 'resumen',
  unidad: 'códigos de equipo',
  placeholder: 'Buscar por código o denominación…',
  campos: [
    { clave: 'codigo',   etiqueta: 'Código' },
    { clave: 'grupo',    etiqueta: 'Grupo genérico' },
    { clave: 'familia',  etiqueta: 'Familia' },
    { clave: 'ficha',      etiqueta: 'Estado de ficha' },
    { clave: 'pendientes', etiqueta: 'Observaciones' },
    { clave: 'version',  etiqueta: 'Versión del sustento' },
    { clave: 'cantidad', etiqueta: 'Cantidad' },
  ],
  excel: {
    hoja: 'Seguimiento al Contratista',
    archivo: 'CS-PARACHIQUE_seguimiento_fichas',
    proyecto: D.meta.proyecto,
    subtitulo: `CUI N° ${D.meta.cui} · ${D.meta.ubicacion} · Nivel ${D.meta.nivelEESS} — Cuadro de seguimiento de fichas técnicas: informe del Contratista, respuesta de la Supervisión y observaciones por levantar`,
    supervisor: D.meta.supervisor,
    cip: D.meta.cip,
    supervision: D.meta.supervision,
    propietario: D.meta.supervisor,
  },
});
/* Los documentos citados dentro de una ficha abren en el mismo visor, con
   vuelta a la ficha de la que se salió. */
function enlazarDocsFicha() {
  document.querySelectorAll('[data-doc-ficha]').forEach((el) => {
    if (el.dataset.enlazado) return;
    el.dataset.enlazado = '1';
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const d = DOC.find((x) => x.id === el.dataset.docFicha);
      const cod = el.dataset.docCod;
      abrirFichaDocumento(d, D.etapas);
      const meta = document.getElementById('vmeta');
      if (meta && cod) {
        meta.insertAdjacentHTML('afterbegin',
          `<button type="button" class="btn" style="padding:3px 9px;font-size:.72rem;margin-right:8px" data-volver="${esc(cod)}">← Volver a ${esc(cod)}</button>`);
        meta.querySelector('[data-volver]').addEventListener('click', () => fichaItem(cod));
      }
    });
  });
}


activarTips(document);
</script>
