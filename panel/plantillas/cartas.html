<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartas y Respuestas — CS Parachique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="envoltura" id="app"></div>
<script>/*__JS__*/</script>
<script>
/* Tablero compartido. No lleva honorarios ni importes: eso vive solo en el
   tablero reservado del supervisor. */
const D = /*__DATOS__*/ null;

const recibidas = D.documentos.filter((d) => d.flujo === 'RECIBIDA');
const emitidas = D.documentos.filter((d) => d.flujo === 'EMITIDA');
const sinContestar = recibidas.filter((d) => d.estado !== 'ATENDIDA');
const sinMembrete = emitidas.filter((d) => !d.membrete && d.clase === 'INFORME').length;
const nombreEtapa = (id) => (D.etapas.find((e) => e.id === id) || {}).nombre || 'Sin etapa';
const cronologico = [...D.documentos].sort((a, b) => a.fecha.localeCompare(b.fecha));

let h = `
<header class="cabecera">
  <div>
    <p class="kicker">Supervisión de equipamiento · Trazabilidad documental</p>
    <h1>Cartas y Respuestas</h1>
    <p class="sub">Lo que entra y exige pronunciamiento, y lo que sale con el membrete oficial. Cada documento está asignado a una etapa y a las áreas técnicas que toca.</p>
  </div>
  ${sello(D)}
</header>`;

/* ---------- Cifras ---------- */
h += `<div class="rejilla g4">
  <div class="tarjeta clic" id="k-recibidas">
    <div class="cifra-rotulo">Documentos recibidos</div>
    <div class="cifra">${recibidas.length}</div>
    <div class="cifra-pie">Del Contratista, exigen pronunciamiento</div>
  </div>
  <div class="tarjeta clic" id="k-sincontestar">
    <div class="cifra-rotulo">Sin contestar</div>
    <div class="cifra" style="color:${sinContestar.length ? 'var(--critico)' : 'var(--bien)'}">${sinContestar.length}</div>
    <div class="cifra-pie">${sinContestar.length ? 'Requieren pronunciamiento de la Supervisión' : 'Todo lo recibido tiene respuesta emitida'}</div>
  </div>
  <div class="tarjeta clic" id="k-emitidas">
    <div class="cifra-rotulo">Documentos emitidos</div>
    <div class="cifra">${emitidas.length}</div>
    <div class="cifra-pie">${emitidas.filter((d) => d.clase === 'INFORME').length} informes · ${emitidas.filter((d) => d.clase === 'CARTA').length} cartas</div>
  </div>
  <div class="tarjeta clic" id="k-membrete">
    <div class="cifra-rotulo">Control de membrete</div>
    <div class="cifra" style="color:${sinMembrete ? 'var(--critico)' : 'var(--bien)'};font-size:1.6rem">${sinMembrete ? sinMembrete + ' sin membrete' : 'Conforme'}</div>
    <div class="cifra-pie">${sinMembrete ? 'Ningún informe sale sin el membrete oficial' : 'Todos los informes llevan el membrete oficial'}</div>
  </div>
</div>`;

/* ---------- Cadena de trazabilidad ---------- */
h += `<div class="seccion">
  <h2>Cadena de trazabilidad</h2>
  <p class="nota">Qué documento responde a cuál. Toque cualquiera de las dos piezas para abrirla.</p>
  <div class="rejilla" style="gap:10px">
  ${recibidas.map((r) => {
    const resp = emitidas.find((e) => e.codigo === r.respondidaPor);
    return `<div class="tarjeta" style="padding:0;overflow:hidden">
      <div style="display:grid;grid-template-columns:1fr 44px 1fr;align-items:stretch">
        <div class="clic" data-doc="${esc(r.id)}" style="padding:16px 18px;cursor:pointer">
          <div class="cifra-rotulo" style="color:var(--serie-2)">Recibida · ${fechaCorta(r.fecha)}</div>
          <div style="font-weight:700;margin-top:6px;font-size:.9rem">${esc(r.codigo)}</div>
          <div style="font-size:.8rem;color:var(--tinta-suave);margin-top:4px">${esc(r.asunto)}</div>
          <div style="margin-top:9px">${insigniaEstado(r.estado)}</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;background:var(--superficie-2);border-left:1px solid var(--borde);border-right:1px solid var(--borde);color:var(--tinta-tenue);font-size:18px">&rarr;</div>
        <div class="clic" data-doc="${resp ? esc(resp.id) : ''}" style="padding:16px 18px;cursor:${resp ? 'pointer' : 'default'}">
          ${resp ? `
            <div class="cifra-rotulo" style="color:var(--serie-3)">Emitida · ${fechaCorta(resp.fecha)}</div>
            <div style="font-weight:700;margin-top:6px;font-size:.9rem" class="cod">${esc(resp.codigo)}</div>
            <div style="font-size:.8rem;color:var(--tinta-suave);margin-top:4px">${esc(resp.asunto)}</div>
            <div style="margin-top:9px">${insigniaEstado(resp.estado)}</div>
          ` : `<div class="cifra-rotulo" style="color:var(--critico)">Sin respuesta emitida</div>
               <div style="font-size:.82rem;color:var(--tinta-suave);margin-top:8px">Pendiente de pronunciamiento de la Supervisión.</div>`}
        </div>
      </div>
    </div>`;
  }).join('')}
  </div>
</div>`;

/* ---------- Registro con etapas, fechas y filtros ---------- */
const etapasConDocs = D.etapas.filter((e) => D.documentos.some((d) => d.etapa === e.id));

h += `<div class="seccion">
  <h2>Registro documental</h2>
  <p class="nota">Encienda o apague etapas para ver solo sus documentos. Doble clic sobre una etapa la deja sola. Toque una fila para abrir el documento y previsualizarlo.</p>

  <div id="etapas"></div>
  <div id="fechas"></div>
  <div id="filtros"></div>
  <div id="resumen"></div>

  <div class="tabla-caja"><div class="tabla-scroll">
    <table class="datos" id="t-docs">
      <thead><tr><th>Fecha</th><th>Flujo</th><th>Código</th><th>Asunto</th><th>Etapa</th><th>Áreas</th><th>Estado</th><th>Membrete</th></tr></thead>
      <tbody>${cronologico.map((d) => `
        <tr class="clic" data-doc="${esc(d.id)}"
          data-f-fecha="${esc(d.fecha)}"
          data-f-etapa="${esc(d.etapa)}"
          data-f-etapanombre="${esc(nombreEtapa(d.etapa))}"
          data-f-flujo="${d.flujo === 'RECIBIDA' ? 'Recibida' : 'Emitida'}"
          data-f-clase="${esc(d.clase)}"
          data-f-area="${esc((d.areas || [])[0] || 'Transversal / documental')}"
          data-f-estado="${esc(d.estado)}">
          <td style="white-space:nowrap">${fechaCorta(d.fecha)}</td>
          <td>${d.flujo === 'RECIBIDA' ? insignia('Recibida', 'serio', 'serio') : insignia('Emitida', 'info', 'info')}</td>
          <td class="cod">${esc(d.codigo)}</td>
          <td>${esc(d.asunto)}<div style="font-size:.75rem;color:var(--tinta-tenue);margin-top:3px">${esc(d.contraparte)}</div></td>
          <td style="font-size:.75rem">${esc(nombreEtapa(d.etapa))}</td>
          <td style="font-size:.72rem;color:var(--tinta-suave)">${(d.areas || []).join(' · ')}</td>
          <td>${insigniaEstado(d.estado)}</td>
          <td>${insigniaMembrete(d, true)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div></div>
</div>`;

/* ---------- Desagregado de pronunciamientos ---------- */
D.pronunciamientos.forEach((p, idx) => {
  const esFormato = !!p.verificacionTecnica;
  h += `<div class="seccion">
    <h2>Pronunciamiento N° ${String(idx + 1).padStart(3, '0')}</h2>
    <p class="nota"><span class="cod">${esc(p.informe)}</span> absuelve <b>${esc(p.documentoAbsuelto)}</b>.
    ${esFormato ? esc(p.resultado) : `${p.observaciones} observaciones desagregadas en ${p.extremos} extremos, con pronunciamiento individual sobre cada uno.`}</p>

    ${esFormato ? `
      <div class="rejilla g3" style="margin-bottom:14px">
        <div class="tarjeta"><div class="cifra-rotulo">Requisitos verificados</div><div class="cifra" style="color:var(--bien)">${p.requisitosCumplidos}<small>de ${p.requisitosVerificados}</small></div><div class="cifra-pie">El equipo cumple el 100% de lo exigido</div></div>
        <div class="tarjeta"><div class="cifra-rotulo">Observaciones</div><div class="cifra" style="color:var(--serio)">${p.observaciones}</div><div class="cifra-pie">${p.sustanciales} sustancial · ${p.leves} leves</div></div>
        <div class="tarjeta clic" id="autenticidad-${idx}"><div class="cifra-rotulo">Autenticidad del sustento</div><div class="cifra" style="color:var(--bien);font-size:1.5rem">Conforme</div><div class="cifra-pie">Verificado contra el fabricante · ver detalle</div></div>
      </div>
      <div class="tabla-caja"><div class="tabla-scroll">
        <table class="datos">
          <thead><tr><th>Requisito</th><th>Exigencia del expediente</th><th>Folio</th><th>Resultado</th></tr></thead>
          <tbody>${p.verificacionTecnica.map((v) => `<tr>
            <td class="cod">${esc(v.req)}</td><td>${esc(v.exigencia)}</td>
            <td>${esc(v.folio)}</td><td>${insignia(v.resultado, 'bien', 'bien')}</td></tr>`).join('')}</tbody>
        </table>
      </div></div>
      <div class="cifra-rotulo" style="margin:18px 0 8px">Observaciones formuladas</div>
      <div class="lista-obs">${p.detalle.map((o) => `
        <div class="obs-item p-${esc(o.nivel)}">
          <div class="enc"><span class="n">${esc(o.obs)}</span><h4>${esc(o.materia)}</h4>
          ${insignia(o.nivel, o.nivel === 'SUSTANCIAL' ? 'serio' : 'aviso', o.nivel === 'SUSTANCIAL' ? 'serio' : 'aviso')}</div>
          <dl><dt>Ubicación</dt><dd>${esc(o.ubicacion)}</dd>
              <dt>Estado</dt><dd>${esc(o.estado)}</dd></dl>
        </div>`).join('')}</div>
    ` : `
      <div class="rejilla g3" style="margin-bottom:14px">
        <div class="tarjeta"><div class="cifra-rotulo">Confirmadas</div><div class="cifra" style="color:var(--serie-1)">${p.confirmadas}</div><div class="cifra-pie">La Supervisión hace suya la observación</div></div>
        <div class="tarjeta"><div class="cifra-rotulo">Trasladadas al Proyectista</div><div class="cifra" style="color:var(--serie-2)">${p.trasladadas}</div><div class="cifra-pie">Corresponde absolución de ${esc(D.meta.proyectista)}</div></div>
        <div class="tarjeta"><div class="cifra-rotulo">Ya absueltas</div><div class="cifra" style="color:var(--serie-3)">${p.yaAbsueltas}</div><div class="cifra-pie">Resueltas en el expediente vigente</div></div>
      </div>
      <div class="grafico" style="margin-bottom:14px">
        <h3>Distribución de los ${p.extremos} extremos</h3>
        <p class="sub">Cada extremo recibió pronunciamiento individual.</p>
        <div class="barra">
          <div data-tip="Confirmadas|${p.confirmadas} extremos" style="width:${(p.confirmadas / p.extremos * 100).toFixed(1)}%;background:var(--serie-1)">${p.confirmadas}</div>
          <div data-tip="Trasladadas al Proyectista|${p.trasladadas} extremos" style="width:${(p.trasladadas / p.extremos * 100).toFixed(1)}%;background:var(--serie-2)">${p.trasladadas}</div>
          <div data-tip="Ya absueltas|${p.yaAbsueltas} extremos" style="width:${(p.yaAbsueltas / p.extremos * 100).toFixed(1)}%;background:var(--serie-3)">${p.yaAbsueltas}</div>
        </div>
        <div class="leyenda">
          <span><i style="background:var(--serie-1)"></i>Confirmadas — ${p.confirmadas}</span>
          <span><i style="background:var(--serie-2)"></i>Trasladadas — ${p.trasladadas}</span>
          <span><i style="background:var(--serie-3)"></i>Ya absueltas — ${p.yaAbsueltas}</span>
        </div>
      </div>
      <div class="tabla-caja"><div class="tabla-scroll">
        <table class="datos">
          <thead><tr><th>Obs.</th><th>Equipo / materia</th><th>Ubicación</th><th class="num">Extremos</th><th class="num">Confirm.</th><th class="num">Traslad.</th><th class="num">Ya abs.</th></tr></thead>
          <tbody>${p.detalle.map((o) => `<tr>
            <td class="cod">${esc(o.obs)}</td><td><b>${esc(o.equipo)}</b></td>
            <td style="font-size:.76rem;color:var(--tinta-suave)">${esc(o.ubicacion)}</td>
            <td class="num">${o.extremos}</td><td class="num">${o.confirmadas || '—'}</td>
            <td class="num">${o.trasladadas || '—'}</td><td class="num">${o.yaAbsueltas || '—'}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td colspan="3">Totales</td><td class="num">${p.extremos}</td><td class="num">${p.confirmadas}</td><td class="num">${p.trasladadas}</td><td class="num">${p.yaAbsueltas}</td></tr></tfoot>
        </table>
      </div></div>
    `}
  </div>`;
});

/* ---------- Protocolo ---------- */
h += `<div class="seccion">
  <h2>Protocolo de respuesta</h2>
  <p class="nota">Secuencia obligatoria antes de emitir cualquier documento de la especialidad.</p>
  <div class="tarjeta"><ol class="pasos">${D.protocoloRespuesta.map((p) => `<li>${esc(p)}</li>`).join('')}</ol></div>
</div>`;

h += pie(D);
document.getElementById('app').innerHTML = h;

/* ---------- Interacciones ---------- */
document.querySelectorAll('[data-doc]').forEach((el) => {
  const id = el.dataset.doc;
  if (!id) return;
  el.addEventListener('click', () => {
    const d = D.documentos.find((x) => x.id === id);
    if (d) abrirFichaDocumento(d, D.etapas);
  });
});

const listado = (titulo, meta, docs) => abrirVentana(titulo, meta,
  docs.length ? `<div class="tabla-caja"><div class="tabla-scroll"><table class="datos">
    <thead><tr><th>Fecha</th><th>Código</th><th>Asunto</th><th>Estado</th></tr></thead>
    <tbody>${docs.map((d) => `<tr><td style="white-space:nowrap">${fechaCorta(d.fecha)}</td>
      <td class="cod">${esc(d.codigo)}</td><td>${esc(d.asunto)}</td>
      <td>${insigniaEstado(d.estado)}</td></tr>`).join('')}</tbody>
  </table></div></div>` : '<div class="aviso-caja">No hay documentos en esta condición.</div>');

document.getElementById('k-recibidas').addEventListener('click', () =>
  listado('Documentos recibidos', `${recibidas.length} del Contratista`, recibidas));
document.getElementById('k-sincontestar').addEventListener('click', () =>
  listado('Documentos sin contestar', sinContestar.length ? `${sinContestar.length} pendientes` : 'Sin pendientes', sinContestar));
document.getElementById('k-emitidas').addEventListener('click', () =>
  listado('Documentos emitidos', `${emitidas.length} de la Supervisión`, emitidas));

document.getElementById('k-membrete').addEventListener('click', () => {
  abrirVentana('Control de membrete oficial', esc(D.membrete.archivo),
    `<div class="aviso-caja" style="border-style:solid;border-color:${sinMembrete ? 'var(--critico)' : 'var(--bien)'}">
      <b>${esc(D.membrete.regla)}</b>
      <div class="ruta">${esc(D.membrete.ruta)}</div>
      <div style="margin-top:10px"><button class="btn" onclick="copiar('${esc(D.membrete.ruta).replace(/\\/g, '\\\\')}')">Copiar ruta del membrete</button></div>
    </div>
    <div class="cifra-rotulo" style="margin:20px 0 8px">Situación por documento emitido</div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="datos" style="min-width:460px">
      <thead><tr><th>Documento</th><th>Clase</th><th>Membrete</th></tr></thead>
      <tbody>${emitidas.map((d) => `<tr><td class="cod">${esc(d.codigo)}</td><td>${esc(d.clase)}</td>
        <td>${insigniaMembrete(d, false)}</td></tr>`).join('')}</tbody>
    </table></div></div>`);
});

D.pronunciamientos.forEach((p, idx) => {
  const b = document.getElementById('autenticidad-' + idx);
  if (b && p.autenticidad) {
    b.addEventListener('click', () => abrirVentana('Autenticidad del sustento',
      'Contraste contra la información publicada por el fabricante',
      `<p style="font-size:.88rem;line-height:1.6">${esc(p.autenticidad)}</p>`));
  }
});

/* ---------- Controles de la tabla ---------- */
crearInterruptores({
  contenedor: 'etapas', tabla: 't-docs', campo: 'etapa',
  opciones: etapasConDocs.map((e) => ({
    valor: e.id, etiqueta: e.nombre,
    detalle: e.estado === 'EN CURSO' ? 'En curso' : e.estado.toLowerCase(),
    cuenta: D.documentos.filter((d) => d.etapa === e.id).length,
  })),
});

crearRangoFechas({ contenedor: 'fechas', tabla: 't-docs', campo: 'fecha' });

crearFiltros({
  contenedor: 'filtros', tabla: 't-docs', resumen: 'resumen',
  unidad: 'documentos', placeholder: 'Buscar por código, asunto o contraparte…',
  campos: [
    { clave: 'flujo', etiqueta: 'Flujo' },
    { clave: 'clase', etiqueta: 'Clase' },
    { clave: 'area', etiqueta: 'Área' },
    { clave: 'estado', etiqueta: 'Estado' },
  ],
  excel: {
    hoja: 'Registro documental',
    archivo: 'CS-PARACHIQUE_registro_documental',
    proyecto: D.meta.proyecto,
    subtitulo: `CUI N° ${D.meta.cui} · Registro bidireccional de cartas e informes por etapa y área`,
    supervisor: D.meta.supervisor, cip: D.meta.cip,
    supervision: D.meta.supervision, propietario: D.meta.supervisor,
  },
});

activarTips(document);
</script>
</body>
</html>
